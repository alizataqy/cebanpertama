services:
  app:
    image: node:alpine
    container_name: ceban-pertama-app-dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - WATCHPACK_POLLING=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "apk add --no-cache libc6-compat && npm install && npx prisma generate && npm run dev"
